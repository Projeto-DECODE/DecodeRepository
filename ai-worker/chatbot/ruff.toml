# Regras do ruff para o chatbot: só erros de verdade (pyflakes, pycodestyle
# de erro e bugbear). Estilo e ordem de imports ficam de fora de propósito.
target-version = "py312"
line-length = 120

[lint]
select = ["E", "F", "B"]
# B904 (raise ... from) é recomendação de estilo de exceção, não bug; fica de fora de propósito
ignore = ["B904"]
